<svg fill="none" viewBox="0 0 800 450" width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org">
      <style>
        .wrapper {
          position: relative;
          width: 800px;
          height: 450px;
          background-color: #0d1117; /* GitHub Dark Theme background */
          display: flex;
          justify-content: center;
          align-items: center;
          overflow: hidden;
        }
        /* Background Sparkle Particles */
        .sparkle {
          position: absolute;
          background: white;
          border-radius: 50%;
          opacity: 0;
          animation: sparkleAnim 3s infinite ease-in-out;
        }
        @keyframes sparkleAnim {
          0%, 100% { opacity: 0; transform: scale(0); }
          50% { opacity: 0.8; transform: scale(1.2); }
        }
        /* Your Profile Photo */
        .profile-img {
          position: relative;
          z-index: 10;
          width: 300px;
          height: 300px;
          border-radius: 50%;
          border: 4px solid #fff;
          box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
      </style>
      <div class="wrapper">
        <!-- Background Sparkles -->
        <div class="sparkle" style="width:4px; height:4px; top:10%; left:20%; animation-delay: 0s;"></div>
        <div class="sparkle" style="width:6px; height:6px; top:30%; left:80%; animation-delay: 0.5s;"></div>
        <div class="sparkle" style="width:3px; height:3px; top:70%; left:15%; animation-delay: 1.2s;"></div>
        <div class="sparkle" style="width:5px; height:5px; top:85%; left:60%; animation-delay: 0.8s;"></div>
        <div class="sparkle" style="width:4px; height:4px; top:20%; left:50%; animation-delay: 2s;"></div>
        <div class="sparkle" style="width:6px; height:6px; top:55%; left:35%; animation-delay: 1.5s;"></div>
        
        <!-- Profile Image -->
        <img class="profile-img" src="https://www.akshayaselvakumar.com/New%20Profile.png" alt="Profile" />
      </div>
    </div>
  </foreignObject>
</svg>
          
